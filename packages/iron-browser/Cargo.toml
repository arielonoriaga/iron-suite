[workspace]
resolver = "3"
members = [
    "crates/iron-browser-bus",
    "crates/iron-browser-mcp",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/arielonoriaga/iron-browser"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
