<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IronBrowser — Ready</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #060b13; color: #edf2f8;
    font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: min(640px, 100%); background: #0b1320; border: 1px solid rgba(114, 150, 194, 0.20);
    border-radius: 10px; padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; color: #7086a3; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .pill {
    background: #111c2d; border: 1px solid rgba(114, 150, 194, 0.20); border-radius: 8px;
    padding: 10px 12px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
  }
  .k { color: #3B82F6; display: block; margin-bottom: 4px; }
  .demo { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: #111c2d; color: #edf2f8; border: 1px solid rgba(114, 150, 194, 0.28);
    border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: #3B82F6; }
  input {
    background: #060b13; color: #edf2f8; border: 1px solid rgba(114, 150, 194, 0.24);
    border-radius: 6px; padding: 8px 10px; font: inherit; min-width: 180px;
  }
  #count { color: #34D399; font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
  <main class="card">
    <h1>IronBrowser</h1>
    <p>Site-agnostic dual-viewport developer browser. Enter any URL above, or test mirrored interaction below.</p>
    <div class="grid">
      <div class="pill"><span class="k">Ctrl+Shift+D</span>Single / Dual split</div>
      <div class="pill"><span class="k">Ctrl+M</span>3-tier Mirror sync</div>
      <div class="pill"><span class="k">Ctrl+\</span>Toggle Zen rail</div>
      <div class="pill"><span class="k">Ctrl+L</span>Focus URL bar</div>
    </div>
    <div class="demo">
      <button type="button" data-testid="mirror-ping-btn" id="ping-btn">Mirror Click (<span id="count">0</span>)</button>
      <input type="text" data-testid="mirror-text-input" placeholder="Type to mirror..." aria-label="Mirror input" />
    </div>
  </main>
  <script>
    let n = 0;
    const btn = document.getElementById('ping-btn');
    const out = document.getElementById('count');
    btn.addEventListener('click', (e) => {
      n += 1;
      out.textContent = String(n) + (e.isTrusted ? ' trusted' : ' synthetic');
    });
    const inp = document.querySelector('[data-testid="mirror-text-input"]');
    if (inp) {
      inp.addEventListener('input', (e) => {
        inp.setAttribute('data-last-trusted', String(Boolean(e.isTrusted)));
      });
    }
  </script>
</body>
</html>
