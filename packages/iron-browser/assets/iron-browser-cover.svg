<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
<title id="title">IronBrowser — Public Beta</title>
<desc id="description">Dual-viewport Chromium developer browser and 18-tool native Rust MCP server for The Iron Stack. Simultaneous Portrait and Landscape verification with 3-tier mirrored input, HTTP/WebSocket/SSE/SFS2X deduplication, and POS hardware throttling.</desc>
