[workspace]
members = ["."]
exclude = ["packages/iron-browser", "packages/iron-term"]

[package]
name = "iron-stack"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Zero-cloud SQLite FTS5 + stdio MCP memory hub and multi-agent engineering stack (Claude Code, Codex, Antigravity)"
repository = "https://github.com/arielonoriaga/iron-stack"
homepage = "https://iron.huggian.com"
readme = "README.md"
keywords = ["mcp", "sqlite", "fts5", "memory", "claude"]
categories = ["command-line-utilities", "development-tools", "database"]

[[bin]]
name = "iron"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/iron-{ target }.tar.gz"
bin-dir = "iron"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.43", default-features = false, features = ["cache", "bundled", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
