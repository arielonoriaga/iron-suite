[workspace]
resolver = "3"
members = [
    "crates/iron-proto",
    "crates/iron-agentd",
    "crates/iron-cli",
    "crates/iron-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/arielonoriaga/iron-term"

[workspace.dependencies]
anyhow = "1"
alacritty_terminal = "0.26.0"
clap = { version = "4", features = ["derive", "env"] }
gpui = "0.2.2"
libc = ">=0.2.170, <=0.2.189"
portable-pty = "0.9.0"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
iron-proto = { path = "crates/iron-proto" }
