name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Rust & Eval Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Rust unit & CLI integration tests
        run: cargo test --locked
      - name: Run evaluation harness contract tests
        run: python3 -m unittest discover -s eval -p test_runner.py -v
      - name: Lint shell scripts
        run: shellcheck install.sh integration/*.sh

  build-release-assets:
    name: Build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build release binary
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked --target "${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "iron-${{ matrix.target }}.tar.gz" iron
          shasum -a 256 "iron-${{ matrix.target }}.tar.gz" > "iron-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: |
            iron-${{ matrix.target }}.tar.gz
            iron-${{ matrix.target }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$REPO" --dir dist --pattern "release-*"
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec mv {} dist/ \;
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --repo "$REPO" --clobber dist/*.tar.gz dist/*.sha256
          else
            gh release create "$TAG_NAME" --repo "$REPO" --generate-notes dist/*.tar.gz dist/*.sha256
          fi
